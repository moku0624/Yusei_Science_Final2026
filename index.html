const $=id=>document.getElementById(id);const units=["全分野",...new Set(data.map(x=>x.unit))];$("unit").innerHTML=units.map(x=>'<option>'+x+'</option>').join("");
function save(){try{localStorage.setItem(key,JSON.stringify(hist))}catch(e){alert("履歴を保存できませんでした。履歴のエクスポートをお試しください。")}stats()}
function stats(){let a=0,c=0,w=0;for(let x of Object.values(hist)){a+=x.attempts||0;c+=x.correct||0;if(x.wrong)w++}$("attempts").textContent=a;$("accuracy").textContent=a?Math.round(c/a*100)+"%":"—";$("mistakes").textContent=w;$("count").textContent="収録 "+data.length+"問｜選択中 "+filter().length+"問";$("byunit").innerHTML=units.slice(1).map(u=>{let d=data.filter(x=>x.unit===u),n=d.filter(x=>hist[x.id]?.attempts).length;return u+"："+n+"/"+d.length+"問に挑戦"}).join("<br>")}
function filter(){return data.filter(x=>$("unit").value==="全分野"||x.unit===$("unit").value)}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function start(mode){let d=filter();if(mode==="wrong")d=d.filter(x=>hist[x.id]?.wrong);if(!d.length){alert("対象の問題がありません。");return}queue=mode==="random"?shuffle(d).slice(0,10):shuffle(d);at=0;score=0;$("result").hidden=true;$("quiz").hidden=false;render();$("quiz").scrollIntoView({behavior:"smooth"})}
function render(){answered=false;let x=queue[at];$("category").textContent=x.unit;$("position").textContent=(at+1)+" / "+queue.length;$("bar").style.width=((at+1)/queue.length*100)+"%";$("question").textContent=x.q;$("feedback").hidden=true;$("next").hidden=true;let opts=shuffle(x.options);$("choices").innerHTML="";opts.forEach(v=>{let b=document.createElement("button");b.className="choice";b.textContent=v;b.onclick=()=>choose(v,b);$("choices").appendChild(b)})}
function choose(v,button){if(answered)return;answered=true;let x=queue[at],ok=v===x.a;score+=Number(ok);let h=hist[x.id]||{attempts:0,correct:0,wrong:false};h.attempts++;h.correct+=Number(ok);h.wrong=!ok;hist[x.id]=h;save();for(let b of $("choices").children){b.disabled=true;if(b.textContent===x.a)b.classList.add("correct");else if(b===button)b.classList.add("wrong")}$("feedback").hidden=false;$("feedback").innerHTML="<strong>"+(ok?"正解！":"不正解｜正解："+x.a)+"</strong><div>"+x.why+"</div>";$("next").hidden=false;$("next").textContent=at===queue.length-1?"結果を見る":"次の問題へ →"}
function finish(){ $("quiz").hidden=true;$("result").hidden=false;$("summary").textContent=queue.length+"問中 "+score+"問正解（"+Math.round(score/queue.length*100)+"%）";$("result").scrollIntoView({behavior:"smooth"})}
$("next").onclick=()=>{at++;if(at>=queue.length)finish();else render()};$("start").onclick=()=>start("all");$("random").onclick=()=>start("random");$("wrong").onclick=()=>start("wrong");$("stop").onclick=()=>{$("quiz").hidden=true};$("again").onclick=()=>start("random");$("unit").onchange=stats;
$("export").onclick=()=>{let blob=new Blob([JSON.stringify({version:1,history:hist,exported:new Date().toISOString()},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="science-history.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("import").onclick=()=>$("file").click();$("file").onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!d.history||typeof d.history!=="object"||Array.isArray(d.history))throw Error();if(!confirm("現在の履歴を読み込んだ履歴で置き換えますか？"))return;hist=d.history;save();alert("履歴を読み込みました")}catch{alert("読み込めないファイルです")}finally{e.target.value=""}};
$("reset").onclick=()=>{if(confirm("この端末の学習履歴をすべて削除しますか？")){hist={};save()}};stats();
</script></body></html>
